<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexiFit Pro | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        .hidden { display: none !important; }
        .tab-active { color: #22c55e; border-top: 3px solid #22c55e; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans">
    <div class="bg-white h-[700px] w-full max-w-md shadow-2xl relative overflow-hidden flex flex-col">
        
        <div id="auth-section" class="p-8 flex-1 flex flex-col justify-center">
            <h2 class="text-3xl font-bold text-gray-800 text-center mb-8">FlexiFit Pro</h2>
            <div id="register-fields" class="hidden">
                <input type="text" id="fullname" placeholder="Ad Soyad" class="w-full p-3 mb-4 border rounded bg-gray-50">
                <div class="flex gap-4 mb-4">
                    <input type="number" id="height" placeholder="Boy (cm)" class="w-full p-3 border rounded bg-gray-50">
                    <input type="number" id="weight" placeholder="Kilo (kg)" class="w-full p-3 border rounded bg-gray-50">
                </div>
            </div>
            <input type="email" id="email" placeholder="E-posta" class="w-full p-3 mb-4 border rounded bg-gray-50">
            <input type="password" id="password" placeholder="Şifre" class="w-full p-3 mb-6 border rounded bg-gray-50">
            <button id="auth-btn" onclick="handleAuth()" class="w-full bg-green-500 text-white font-bold py-3 rounded hover:bg-green-600">Giriş Yap</button>
            <p class="mt-4 text-sm text-center text-blue-500 cursor-pointer toggle-link" onclick="toggleAuth()">Hesabın yok mu? Kayıt Ol</p>
        </div>

        <div id="dashboard-section" class="hidden flex-1 flex flex-col overflow-hidden">
            <div class="bg-white border-b p-4 flex justify-between items-center">
                <span class="font-bold text-xl text-green-600">FlexiFit</span>
                <button onclick="logout()" class="text-gray-400 text-sm"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
            </div>

            <div id="content" class="flex-1 p-4 overflow-y-auto pb-20">
                
                <div id="tab-home">
                    <div class="bg-green-500 rounded-2xl p-6 text-white mb-6">
                        <p class="opacity-80">Hoş geldin,</p>
                        <h2 id="home-name" class="text-2xl font-bold">Adil M.</h2>
                        <div class="mt-4 flex justify-between items-end">
                            <div>
                                <p class="text-xs uppercase opacity-80">Güncel Durum</p>
                                <p id="home-bmi" class="text-lg font-semibold">VKİ: Hesaplanıyor...</p>
                            </div>
                            <i class="fa-solid fa-fire text-4xl opacity-50"></i>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white border p-4 rounded-xl text-center">
                            <i class="fa-solid fa-droplet text-blue-500 mb-2"></i>
                            <p class="text-xs text-gray-500 uppercase">Su</p>
                            <p class="font-bold">2.5 L</p>
                        </div>
                        <div class="bg-white border p-4 rounded-xl text-center">
                            <i class="fa-solid fa-shoe-prints text-orange-500 mb-2"></i>
                            <p class="text-xs text-gray-500 uppercase">Adım</p>
                            <p class="font-bold">6,400</p>
                        </div>
                    </div>
                </div>

                <div id="tab-diet" class="hidden">
                    <h3 class="font-bold text-lg mb-4">Beslenme Takibi</h3>
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="food-name" placeholder="Yemek" class="flex-1 p-2 border rounded">
                        <input type="number" id="food-cal" placeholder="Kalori" class="w-20 p-2 border rounded">
                        <button onclick="addFood()" class="bg-green-500 text-white px-4 rounded">+</button>
                    </div>
                    <div id="food-list" class="space-y-2">
                        </div>
                </div>

                <div id="tab-profile" class="hidden text-left">
                    <h3 class="font-bold text-lg mb-4">Profil Ayarları</h3>
                    <div class="space-y-4">
                        <div><label class="text-xs text-gray-500">Ad Soyad</label><input type="text" id="p-name" class="w-full p-2 border-b focus:outline-none"></div>
                        <div class="flex gap-4">
                            <div class="flex-1"><label class="text-xs text-gray-500">Boy (cm)</label><input type="number" id="p-height" class="w-full p-2 border-b"></div>
                            <div class="flex-1"><label class="text-xs text-gray-500">Kilo (kg)</label><input type="number" id="p-weight" class="w-full p-2 border-b"></div>
                        </div>
                        <div><label class="text-xs text-gray-500">Hedef Kilo</label><input type="number" id="p-goal" placeholder="Örn: 75" class="w-full p-2 border-b"></div>
                        <button onclick="updateProfile()" class="w-full bg-gray-800 text-white py-2 rounded">Bilgileri Güncelle</button>
                    </div>
                </div>

                <div id="tab-ai" class="hidden">
                    <div class="text-center py-8">
                        <div class="inline-block p-4 bg-blue-100 rounded-full mb-4">
                            <i class="fa-solid fa-robot text-4xl text-blue-600 animate-bounce"></i>
                        </div>
                        <h3 class="font-bold text-xl mb-2">AI Antrenör</h3>
                        <p class="text-sm text-gray-500 px-8">Verilerine dayanarak sana özel tavsiyeler üretirim.</p>
                        <button onclick="generateAIAdvice()" class="mt-6 bg-blue-600 text-white px-6 py-3 rounded-full shadow-lg">Tavsiye Oluştur</button>
                        <div id="ai-chat-result" class="mt-6 hidden bg-blue-50 p-6 rounded-2xl text-left text-blue-900 border border-blue-100"></div>
                    </div>
                </div>

            </div>

            <div class="bg-white border-t absolute bottom-0 w-full h-16 flex justify-around items-center">
                <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center tab-active"><i class="fa-solid fa-house"></i><span class="text-[10px]">Ana Sayfa</span></button>
                <button onclick="switchTab('diet')" id="nav-diet" class="flex flex-col items-center text-gray-400"><i class="fa-solid fa-utensils"></i><span class="text-[10px]">Beslenme</span></button>
                <button onclick="switchTab('ai')" id="nav-ai" class="flex flex-col items-center text-gray-400"><i class="fa-solid fa-brain"></i><span class="text-[10px]">AI Coach</span></button>
                <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-gray-400"><i class="fa-solid fa-user"></i><span class="text-[10px]">Profil</span></button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>

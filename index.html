<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexiFit Pro | Akıllı Beslenme ve Antrenör</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-center">
        <div id="auth-section">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">🥗 💪</h1>
            <h2 class="text-2xl font-bold text-gray-800 mb-6">FlexiFit Pro</h2>
            <h3 id="form-title" class="text-lg font-semibold text-gray-600 mb-6">Sisteme Giriş Yap</h3>
            
            <div id="register-fields" class="hidden">
                <input type="text" id="fullname" placeholder="Ad Soyad" class="w-full p-3 mb-4 border rounded bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-400">
                <div class="flex gap-4 mb-4">
                    <input type="number" id="height" placeholder="Boy (cm)" class="w-full p-3 border rounded bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-400">
                    <input type="number" id="weight" placeholder="Kilo (kg)" class="w-full p-3 border rounded bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-400">
                </div>
            </div>

            <input type="email" id="email" placeholder="E-posta Adresi" class="w-full p-3 mb-4 border rounded bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-400">
            <input type="password" id="password" placeholder="Şifre" class="w-full p-3 mb-6 border rounded bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-400">
            
            <button id="auth-btn" onclick="handleAuth()" class="w-full bg-green-500 text-white font-bold py-3 rounded hover:bg-green-600 transition duration-300">Giriş Yap</button>
            <p class="mt-4 text-sm text-blue-500 cursor-pointer hover:underline toggle-link" onclick="toggleAuth()">Hesabın yok mu? Kayıt Ol</p>
        </div>

        <div id="dashboard-section" class="hidden">
            <h2 class="text-2xl font-bold text-green-600 mb-4">FlexiFit Panel</h2>
            
            <div class="bg-gray-50 p-4 rounded-lg mb-6 text-left border border-gray-200 shadow-sm">
                <h3 class="font-bold text-gray-700 border-b pb-2 mb-3">👤 Profil Özeti</h3>
                <p class="text-sm text-gray-700 mb-1"><strong>Ad Soyad:</strong> <span id="display-name" class="text-blue-600"></span></p>
                <p class="text-sm text-gray-700 mb-1"><strong>Boy:</strong> <span id="display-height" class="font-medium"></span> cm</p>
                <p class="text-sm text-gray-700 mb-1"><strong>Kilo:</strong> <span id="display-weight" class="font-medium"></span> kg</p>
                <div class="mt-3 p-2 bg-green-100 rounded text-center">
                    <p class="text-sm font-bold text-green-800" id="display-bmi"></p>
                </div>
            </div>
            
            <button onclick="getAIAdvice()" class="w-full bg-blue-500 text-white font-bold py-3 rounded mb-3 hover:bg-blue-600 transition">🤖 AI Beslenme Tavsiyesi Al</button>
            <div id="ai-result" class="hidden bg-blue-50 p-4 border border-blue-200 rounded text-sm text-left mb-4 text-blue-800 transition"></div>
            
            <button onclick="scanBarcode()" class="w-full bg-gray-800 text-white font-bold py-3 rounded mb-4 hover:bg-gray-900 transition">📷 Ürün Barkodu Okut</button>
            
            <button onclick="showAdminData()" class="w-full bg-yellow-500 text-white font-bold py-2 rounded mb-6 hover:bg-yellow-600 transition">🛠️ Sistem Logları</button>
            <pre id="admin-log" class="hidden bg-black text-green-400 p-4 rounded text-xs text-left overflow-x-auto mb-4"></pre>

            <button onclick="logout()" class="text-red-500 font-semibold hover:underline">Çıkış Yap</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
